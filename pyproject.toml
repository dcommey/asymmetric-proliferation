[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asymmetric-proliferation"
version = "0.1.0"
description = "Release-policy model under asymmetric AI capability diffusion"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["reportlab==4.4.9"]

[tool.setuptools.packages.find]
include = ["asymprolif*"]

[tool.setuptools.package-data]
asymprolif = ["data/*.csv"]
