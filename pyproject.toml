[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asymmetric-proliferation"
version = "0.2.0"
description = "Model of AI release policy with asymmetric capability diffusion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["asymprolif*"]

[tool.setuptools.package-data]
asymprolif = ["data/*.csv"]
